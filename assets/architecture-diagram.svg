<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#080d18; font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#080d18" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filter for subtle drop shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="780" fill="url(#bgGlow)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="0" y1="550" x2="1200" y2="550" />
    <line x1="280" y1="0" x2="280" y2="780" />
    <line x1="620" y1="0" x2="620" y2="780" />
    <line x1="920" y1="0" x2="920" y2="780" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#indigoGrad)" filter="url(#glow)"/>
    <circle cx="18" cy="18" r="6" fill="#ffffff" />
    <text x="50" y="25" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="-0.5px">NexusOS</text>
    <rect x="150" y="8" width="55" height="22" rx="11" fill="rgba(79,70,229,0.2)" stroke="#4f46e5" stroke-width="1"/>
    <text x="166" y="23" fill="#a5b4fc" font-size="11" font-weight="700">v2.0</text>
    <text x="220" y="24" fill="#94a3b8" font-size="13" font-weight="500">Enterprise High-Scale D2C Automation Architecture</text>
  </g>

  <!-- Status Chip Top Right -->
  <g transform="translate(980, 40)">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#10b981"/>
    <text x="32" y="21" fill="#34d399" font-size="12" font-weight="600">All Systems Online</text>
  </g>

  <!-- ================= TIER 1: CHANNEL INGESTION ================= -->
  <g transform="translate(60, 110)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1px" text-transform="uppercase">TIER 1 · Omnichannel Sales Ingestion</text>
    
    <!-- Channel 1: Amazon -->
    <g transform="translate(0, 16)" filter="url(#cardShadow)">
      <rect width="210" height="74" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="14" y="14" width="32" height="32" rx="6" fill="rgba(255,153,0,0.12)" stroke="rgba(255,153,0,0.3)"/>
      <text x="21" y="34" fill="#ff9900" font-size="10" font-weight="800">AMZ</text>
      <text x="56" y="28" fill="#f1f5f9" font-size="13" font-weight="600">Amazon India</text>
      <text x="56" y="44" fill="#64748b" font-size="11" font-family="'JetBrains Mono',monospace">SP-API · 10m Polling</text>
    </g>

    <!-- Channel 2: Flipkart -->
    <g transform="translate(0, 105)" filter="url(#cardShadow)">
      <rect width="210" height="74" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="14" y="14" width="32" height="32" rx="6" fill="rgba(40,116,240,0.12)" stroke="rgba(40,116,240,0.3)"/>
      <text x="24" y="34" fill="#2874f0" font-size="10" font-weight="800">FK</text>
      <text x="56" y="28" fill="#f1f5f9" font-size="13" font-weight="600">Flipkart Direct</text>
      <text x="56" y="44" fill="#64748b" font-size="11" font-family="'JetBrains Mono',monospace">RTD State Sync</text>
    </g>

    <!-- Channel 3: Shopify -->
    <g transform="translate(0, 194)" filter="url(#cardShadow)">
      <rect width="210" height="74" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="14" y="14" width="32" height="32" rx="6" fill="rgba(150,191,72,0.12)" stroke="rgba(150,191,72,0.3)"/>
      <text x="18" y="34" fill="#96bf48" font-size="10" font-weight="800">SHO</text>
      <text x="56" y="28" fill="#f1f5f9" font-size="13" font-weight="600">Shopify Store</text>
      <text x="56" y="44" fill="#34d399" font-size="11" font-family="'JetBrains Mono',monospace">Live Webhook Feed</text>
    </g>

    <!-- Channel 4: Myntra & Meesho -->
    <g transform="translate(0, 283)" filter="url(#cardShadow)">
      <rect width="210" height="74" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="14" y="14" width="32" height="32" rx="6" fill="rgba(244,63,94,0.12)" stroke="rgba(244,63,94,0.3)"/>
      <text x="18" y="34" fill="#f43f5e" font-size="10" font-weight="800">MYN</text>
      <text x="56" y="28" fill="#f1f5f9" font-size="13" font-weight="600">Myntra &amp; Meesho</text>
      <text x="56" y="44" fill="#64748b" font-size="11" font-family="'JetBrains Mono',monospace">Scheduled FTP / REST</text>
    </g>
  </g>

  <!-- Flow Arrows: Tier 1 to Tier 2 -->
  <g stroke="#4f46e5" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6">
    <path d="M 270 162 L 340 162" />
    <path d="M 270 252 L 340 252" />
    <path d="M 270 340 L 340 340" />
    <path d="M 270 430 L 340 430" />
  </g>

  <!-- ================= TIER 2: NEXUS EVENT ROUTER & BUS ================= -->
  <g transform="translate(340, 110)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1px" text-transform="uppercase">TIER 2 · Real-Time Event Bus &amp; Normalization</text>

    <g transform="translate(0, 16)" filter="url(#cardShadow)">
      <rect width="230" height="341" rx="12" fill="#111827" stroke="rgba(79,70,229,0.3)" stroke-width="1"/>
      
      <!-- Core Event Hub Header -->
      <rect x="12" y="12" width="206" height="42" rx="8" fill="rgba(79,70,229,0.1)" stroke="rgba(79,70,229,0.2)"/>
      <text x="24" y="37" fill="#818cf8" font-size="13" font-weight="700">Unified Ingestion Bus</text>

      <!-- Worker Stack Items -->
      <g transform="translate(14, 70)">
        <rect width="202" height="48" rx="6" fill="#161f30" stroke="rgba(255,255,255,0.06)"/>
        <text x="12" y="22" fill="#e2e8f0" font-size="11" font-weight="600">Payload De-duplication</text>
        <text x="12" y="38" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">Worker Node-04a</text>
      </g>

      <g transform="translate(14, 126)">
        <rect width="202" height="48" rx="6" fill="#161f30" stroke="rgba(255,255,255,0.06)"/>
        <text x="12" y="22" fill="#e2e8f0" font-size="11" font-weight="600">SKU Barcode Cross-Map</text>
        <text x="12" y="38" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">Catalog Matrix Match</text>
      </g>

      <g transform="translate(14, 182)">
        <rect width="202" height="48" rx="6" fill="#161f30" stroke="rgba(255,255,255,0.06)"/>
        <text x="12" y="22" fill="#e2e8f0" font-size="11" font-weight="600">Tare &amp; Volumetric Weight</text>
        <text x="12" y="38" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono',monospace">Rule: Box (+150g) / 5000</text>
      </g>

      <g transform="translate(14, 238)">
        <rect width="202" height="52" rx="6" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.2)"/>
        <text x="12" y="22" fill="#34d399" font-size="11" font-weight="700">Dynamic Throughput</text>
        <text x="12" y="40" fill="#10b981" font-size="13" font-weight="800" font-family="'JetBrains Mono',monospace">4,850 actions/min</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrows: Tier 2 to Tier 3 -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.7">
    <path d="M 570 200 L 640 200" />
    <path d="M 570 300 L 640 300" />
  </g>

  <!-- ================= TIER 3: INTELLIGENT EXECUTION ENGINES ================= -->
  <g transform="translate(640, 110)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1px" text-transform="uppercase">TIER 3 · Core Intelligent Execution Matrix (50 Engines)</text>

    <!-- Engine 1: AI RTO Interceptor -->
    <g transform="translate(0, 16)" filter="url(#cardShadow)">
      <rect width="240" height="98" rx="10" fill="#111827" stroke="rgba(244,63,94,0.3)" stroke-width="1"/>
      <rect x="14" y="14" width="8" height="8" rx="4" fill="#f43f5e"/>
      <text x="30" y="22" fill="#fda4af" font-size="12" font-weight="700">AI-RTO Interception Loop</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10.5">Scans PIN fraud risk + buyer history.</text>
      <rect x="14" y="58" width="130" height="24" rx="4" fill="rgba(244,63,94,0.1)"/>
      <text x="22" y="74" fill="#f43f5e" font-size="10.5" font-family="'JetBrains Mono',monospace">WhatsApp COD Verify</text>
      <text x="155" y="74" fill="#34d399" font-size="11" font-weight="700">1,284 Saved</text>
    </g>

    <!-- Engine 2: Spatial Courier Routing -->
    <g transform="translate(0, 126)" filter="url(#cardShadow)">
      <rect width="240" height="98" rx="10" fill="#111827" stroke="rgba(79,70,229,0.3)" stroke-width="1"/>
      <rect x="14" y="14" width="8" height="8" rx="4" fill="#6366f1"/>
      <text x="30" y="22" fill="#c7d2fe" font-size="12" font-weight="700">Spatial Courier Router</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10.5">Evaluates SLA, Zone pricing &amp; SLAs.</text>
      <rect x="14" y="58" width="212" height="24" rx="4" fill="#161f30"/>
      <text x="22" y="74" fill="#818cf8" font-size="10" font-family="'JetBrains Mono',monospace">BlueDart · Shiprocket · Delhivery</text>
    </g>

    <!-- Engine 3: Predictive Inventory Pooling -->
    <g transform="translate(0, 236)" filter="url(#cardShadow)">
      <rect width="240" height="121" rx="10" fill="#111827" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <rect x="14" y="14" width="8" height="8" rx="4" fill="#10b981"/>
      <text x="30" y="22" fill="#6ee7b7" font-size="12" font-weight="700">Predictive Stock Pooler</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10.5">Multi-node unified stock buffering.</text>
      <rect x="14" y="56" width="212" height="20" rx="4" fill="#161f30"/>
      <text x="22" y="70" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono',monospace">Prevents Marketplace Stockouts</text>
      <rect x="14" y="82" width="212" height="24" rx="4" fill="rgba(16,185,129,0.08)"/>
      <text x="22" y="98" fill="#34d399" font-size="10" font-weight="600">Auto Low-Stock PO Generation</text>
    </g>
  </g>

  <!-- Flow Arrows: Tier 3 to Tier 4 -->
  <g stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.7">
    <path d="M 880 200 L 950 200" />
    <path d="M 880 300 L 950 300" />
  </g>

  <!-- ================= TIER 4: PHYSICAL WAREHOUSES & DISPATCH ================= -->
  <g transform="translate(950, 110)">
    <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1px" text-transform="uppercase">TIER 4 · Multi-Node Fulfillment</text>

    <!-- WH 1: North -->
    <g transform="translate(0, 16)" filter="url(#cardShadow)">
      <rect width="190" height="74" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="26" fill="#f8fafc" font-size="12" font-weight="700">Delhi-NCR Hub (WH-01)</text>
      <text x="16" y="44" fill="#64748b" font-size="10.5">Auto-Print &amp; Thermal Scan</text>
      <text x="16" y="60" fill="#10b981" font-size="10" font-weight="600">AWB Instant Assigned</text>
    </g>

    <!-- WH 2: West -->
    <g transform="translate(0, 105)" filter="url(#cardShadow)">
      <rect width="190" height="74" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="26" fill="#f8fafc" font-size="12" font-weight="700">Bhiwandi Hub (WH-02)</text>
      <text x="16" y="44" fill="#64748b" font-size="10.5">Fixed Cardboard Tare Calc</text>
      <text x="16" y="60" fill="#38bdf8" font-size="10" font-weight="600">RTD Handover Marked</text>
    </g>

    <!-- WH 3: South -->
    <g transform="translate(0, 194)" filter="url(#cardShadow)">
      <rect width="190" height="74" rx="10" fill="#111827" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="26" fill="#f8fafc" font-size="12" font-weight="700">Bengaluru Hub (WH-03)</text>
      <text x="16" y="44" fill="#64748b" font-size="10.5">Scheduled Courier Pickup</text>
      <text x="16" y="60" fill="#818cf8" font-size="10" font-weight="600">Auto-Manifest Generated</text>
    </g>

    <!-- Customer Handover -->
    <g transform="translate(0, 283)" filter="url(#cardShadow)">
      <rect width="190" height="74" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="16" y="26" fill="#34d399" font-size="12" font-weight="700">Customer Delivery</text>
      <text x="16" y="44" fill="#94a3b8" font-size="10.5">SMS &amp; WhatsApp Alerts</text>
      <text x="16" y="60" fill="#10b981" font-size="10" font-weight="600">99.97% Sync Accuracy</text>
    </g>
  </g>

  <!-- ================= BOTTOM TIER: AUDIT & TELEMETRY LOOP ================= -->
  <g transform="translate(60, 520)" filter="url(#cardShadow)">
    <rect width="1080" height="200" rx="12" fill="#0d1424" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Title -->
    <rect x="0" y="0" width="1080" height="42" rx="12" fill="#111827"/>
    <circle cx="24" cy="21" r="5" fill="#6366f1"/>
    <text x="38" y="25" fill="#f1f5f9" font-size="13" font-weight="700">Live Operation &amp; Trace Streams (Audit &amp; Diagnostic Stack)</text>
    <rect x="940" y="10" width="120" height="22" rx="11" fill="rgba(79,70,229,0.2)" stroke="#4f46e5" stroke-width="1"/>
    <text x="955" y="25" fill="#c7d2fe" font-size="10.5" font-family="'JetBrains Mono',monospace">STREAMING LOG</text>

    <!-- Monospace Terminal Log Entries -->
    <g transform="translate(24, 62)" font-family="'JetBrains Mono',monospace" font-size="11.5">
      <text x="0" y="16" fill="#64748b">17:32:41.205</text>
      <rect x="105" y="4" width="125" height="18" rx="4" fill="rgba(56,189,248,0.15)"/>
      <text x="115" y="17" fill="#38bdf8" font-size="10.5" font-weight="700">OMNICHANNEL_SYNC</text>
      <text x="245" y="16" fill="#94a3b8">worker-04a</text>
      <text x="350" y="16" fill="#f1f5f9">Fetched 14 new orders from Shopify REST Feed. Order reference IDs #SH-92850 to #SH-92864.</text>
      <rect x="1000" y="4" width="45" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="1008" y="17" fill="#34d399" font-size="10" font-weight="700">SYNC</text>

      <text x="0" y="46" fill="#64748b">17:32:38.112</text>
      <rect x="105" y="34" width="125" height="18" rx="4" fill="rgba(79,70,229,0.2)"/>
      <text x="115" y="47" fill="#818cf8" font-size="10.5" font-weight="700">COURIER_ASSIGN</text>
      <text x="245" y="46" fill="#94a3b8">worker-01c</text>
      <text x="350" y="46" fill="#f1f5f9">Assigned AWB #BD-739105 to BlueDart. Payload weight (1.45 kg) matched Zone A pricing rule.</text>
      <rect x="1000" y="34" width="45" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="1008" y="47" fill="#34d399" font-size="10" font-weight="700">PASS</text>

      <text x="0" y="76" fill="#64748b">17:31:59.840</text>
      <rect x="105" y="64" width="125" height="18" rx="4" fill="rgba(244,63,94,0.2)"/>
      <text x="115" y="77" fill="#f43f5e" font-size="10.5" font-weight="700">COD_VERIFICATION</text>
      <text x="245" y="76" fill="#94a3b8">worker-02b</text>
      <text x="350" y="76" fill="#f1f5f9">Dispatched WhatsApp interactive button prompt to +91 98XXX-XXXXX for order #FK-38295.</text>
      <rect x="1000" y="64" width="45" height="18" rx="4" fill="rgba(245,158,11,0.2)"/>
      <text x="1008" y="77" fill="#fbbf24" font-size="10" font-weight="700">HOLD</text>

      <text x="0" y="106" fill="#64748b">17:30:12.441</text>
      <rect x="105" y="94" width="125" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="115" y="107" fill="#34d399" font-size="10.5" font-weight="700">PROFIT_RECON</text>
      <text x="245" y="106" fill="#94a3b8">worker-07f</text>
      <text x="350" y="106" fill="#f1f5f9">Weight discrepancy flagged on Carrier Invoice #INV-8821. Auto-dispute filed saving ₹4,210.</text>
      <rect x="1000" y="94" width="45" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
      <text x="1008" y="107" fill="#34d399" font-size="10" font-weight="700">SAVE</text>
    </g>
  </g>

</svg>
